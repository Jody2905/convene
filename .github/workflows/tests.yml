name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite · Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Command-line smoke test
        run: |
          python -m convene demo
          python -m convene init-demo --db ci.db

  postgres:
    name: PostgreSQL 16 · Python 3.13
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: convene
          POSTGRES_PASSWORD: convene
          POSTGRES_DB: convene_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U convene" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONVENE_TEST_DATABASE_URL: postgresql+psycopg://convene:convene@localhost:5432/convene_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt
      - run: python -m pytest
